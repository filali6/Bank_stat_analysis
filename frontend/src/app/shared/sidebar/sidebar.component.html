<div class="sidebar">
  <div class="brand">{{ 'header.title' | translate }}</div>

  
  <a class="nav-link active" routerLink="/dashboard">{{ 'sidebar.dashboard' | translate }}</a>
   

  <div class="lang-switch">
    <button type="button" class="lang-button" [class.active]="translation.currentLang() === 'fr'"
      (click)="setLang('fr')">FR</button>
    <button type="button" class="lang-button" [class.active]="translation.currentLang() === 'en'"
      (click)="setLang('en')">EN</button>
  </div>

  <div class="sidebar-footer">{{ 'sidebar.footer' | translate }}</div>
</div>
