<div class="page">
  <p class="eyebrow">{{ 'chooseOutput.eyebrow' | translate }}</p>
  <h1>{{ 'chooseOutput.title' | translate }}</h1>
  <p class="subtitle">{{ 'chooseOutput.subtitle' | translate }}</p>

  <div class="output-grid">
    @for (o of outputs; track o.key) {
      <div class="output-card" [class.selected]="session.selectedOutput() === o.key" (click)="select(o.key)">
        @if (session.selectedOutput() === o.key) {
          <span class="selected-tag">{{ 'chooseOutput.selected' | translate }}</span>
        }
        <h3>{{ o.title }}</h3>
        <p>{{ o.desc }}</p>
      </div>
    }
  </div>

  <button class="next-button" [disabled]="!session.selectedOutput()" (click)="continueToStudy()">
    {{ 'stepper.next' | translate }} →
  </button>
</div>
