@if (!session.enrichmentResult()) {
  <p class="placeholder-note">{{ 'categorizationPage.needEnrichmentFirst' | translate }}</p>
} @else {
  <div class="back-row">
    <button class="back-link-btn" (click)="goBack()">← {{ 'stepper.back' | translate }}</button>
    @if (!session.categorizationResult()) {
      <button class="categorize-button" (click)="onCategorize()" [disabled]="session.isLoadingCategorization()">
        {{ session.isLoadingCategorization() ? ('stepper.categorizing' | translate) : ('stepper.categorizeButton' | translate) }}
      </button>
    }
  </div>

  @if (session.errorMessage() && !session.categorizationResult()) {
    <p class="error-message">{{ session.errorMessage() }}</p>
  }

  @if (session.categorizationResult()) {
    <app-categorization-table [result]="session.categorizationResult()"></app-categorization-table>
    <div class="step-actions">
      <button class="next-button" (click)="goNext()">{{ 'stepper.next' | translate }} →</button>
    </div>
  }
}
